<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a14">
<title>CYBERSHIFT</title>

<link rel="manifest" href="./manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.update();
      }).catch(console.error);
    });
  }
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; font-family: sans-serif; position: fixed; }
  canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  
  #hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
  .hud-box { background: rgba(10, 10, 25, 0.7); border: 1px solid rgba(0, 255, 204, 0.3); padding: 8px 16px; border-radius: 20px; color: #fff; font-size: 15px; font-weight: bold; }
  #score { color: #00ffcc; }
  #multiplier { color: #ff0077; margin-left: 6px; }
  
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 12, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    text-align: center;
    padding: 20px;
  }
  h1 { color: #00ffcc; font-size: 2.3rem; letter-spacing: 4px; margin-bottom: 12px; }
  p { color: #ccc; font-size: 1rem; margin-bottom: 30px; line-height: 1.5; }
  
  #btn-action {
    background: linear-gradient(135deg, #00ffcc, #0088ff);
    border: none;
    padding: 18px 50px;
    border-radius: 35px;
    color: #050510;
    font-size: 1.2rem;
    font-weight: 900;
    letter-spacing: 2px;
    outline: none;
    box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
  }
  #high-score { color: #ffcc00; margin-top: 20px; font-size: 1rem; }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-box">SCORE: <span id="score">0</span><span id="multiplier">x1</span></div>
  <div class="hud-box" id="health-box">HP: 3</div>
</div>

<div id="overlay">
  <h1 id="title-text">CYBERSHIFT</h1>
  <p id="sub-text">TAP & HOLD to tether to rings.<br>RELEASE to slingshot upward!</p>
  <button id="btn-action" type="button">ENGAGE</button>
  <div id="high-score">BEST: 0</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const multEl = document.getElementById('multiplier');
const hpEl = document.getElementById('health-box');
const overlay = document.getElementById('overlay');
const btnAction = document.getElementById('btn-action');
const titleText = document.getElementById('title-text');
const subText = document.getElementById('sub-text');
const highScoreEl = document.getElementById('high-score');

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

let state = 'menu';
let score = 0;
let multiplier = 1;
let hp = 3;
let bestScore = parseInt(localStorage.getItem('cybershift_best') || '0');
highScoreEl.innerText = 'BEST: ' + bestScore;

let ship = { x: W / 2, y: H * 0.75, vx: 0, vy: -5, radius: 12, tethered: null, angle: 0, orbitDist: 0, dir: 1, angularSpeed: 0 };
let anchors = [];
let shards = [];
let cameraY = 0;
let ignoreUntil = 0;

function spawnWorld(startY) {
  for (let y = startY; y > startY - 1400; y -= 180) {
    anchors.push({
      x: 60 + Math.random() * (W - 120),
      y: y,
      radius: 22,
      pulse: Math.random() * Math.PI
    });
    if (Math.random() > 0.3) {
      shards.push({
        x: 40 + Math.random() * (W - 80),
        y: y + (Math.random() - 0.5) * 80,
        radius: 8,
        rot: 0
      });
    }
  }
}

function startGame() {
  score = 0;
  multiplier = 1;
  hp = 3;
  cameraY = 0;
  anchors = [];
  shards = [];
  scoreEl.innerText = '0';
  multEl.innerText = 'x1';
  hpEl.innerText = 'HP: 3';

  ship.x = W / 2;
  ship.y = H * 0.75;
  ship.vx = 0;
  ship.vy = -6;
  ship.tethered = null;

  anchors.push({ x: W * 0.35, y: H * 0.55, radius: 22, pulse: 0 });
  anchors.push({ x: W * 0.65, y: H * 0.35, radius: 22, pulse: 1.5 });
  spawnWorld(H * 0.2);

  overlay.style.display = 'none';
  state = 'playing';
  ignoreUntil = Date.now() + 350;
}

btnAction.addEventListener('click', (e) => {
  e.preventDefault();
  startGame();
});

btnAction.addEventListener('touchstart', (e) => {
  e.stopPropagation();
}, { passive: true });

function onActionDown(e) {
  if (state !== 'playing' || Date.now() < ignoreUntil) return;
  if (ship.tethered) return;

  let closest = null;
  let minDist = 280;
  for (let a of anchors) {
    let d = Math.hypot(ship.x - a.x, ship.y - a.y);
    if (d < minDist) {
      minDist = d;
      closest = a;
    }
  }

  if (closest) {
    ship.tethered = closest;
    ship.orbitDist = Math.max(minDist, 50);
    ship.angle = Math.atan2(ship.y - closest.y, ship.x - closest.x);
    let curSpeed = Math.hypot(ship.vx, ship.vy);
    if (curSpeed < 7) curSpeed = 7;
    let tangentX = -Math.sin(ship.angle);
    let tangentY = Math.cos(ship.angle);
    let dot = ship.vx * tangentX + ship.vy * tangentY;
    ship.dir = dot >= 0 ? 1 : -1;
    ship.angularSpeed = (curSpeed / ship.orbitDist) * ship.dir;
  }
}

function onActionUp(e) {
  if (state !== 'playing') return;
  if (ship.tethered) {
    let speed = Math.abs(ship.angularSpeed * ship.orbitDist) * 1.15;
    speed = Math.min(Math.max(speed, 8), 17);
    let releaseAngle = ship.angle + (ship.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    ship.vx = Math.cos(releaseAngle) * speed;
    ship.vy = Math.sin(releaseAngle) * speed;
    ship.tethered = null;
  }
}

window.addEventListener('touchstart', onActionDown, { passive: true });
window.addEventListener('touchend', onActionUp, { passive: true });
window.addEventListener('mousedown', onActionDown);
window.addEventListener('mouseup', onActionUp);

function update() {
  requestAnimationFrame(update);

  if (state === 'playing') {
    if (ship.tethered) {
      ship.angle += ship.angularSpeed;
      ship.x = ship.tethered.x + Math.cos(ship.angle) * ship.orbitDist;
      ship.y = ship.tethered.y + Math.sin(ship.angle) * ship.orbitDist;
      ship.angularSpeed *= 1.002;
    } else {
      ship.x += ship.vx;
      ship.y += ship.vy;
      ship.vy += 0.08;
    }

    if (ship.x < ship.radius) { ship.x = ship.radius; ship.vx = Math.abs(ship.vx) * 0.7; }
    if (ship.x > W - ship.radius) { ship.x = W - ship.radius; ship.vx = -Math.abs(ship.vx) * 0.7; }

    let targetCamY = ship.y - H * 0.65;
    if (targetCamY < cameraY) {
      score += Math.floor((cameraY - targetCamY) * 0.2);
      scoreEl.innerText = score;
      cameraY = targetCamY;
    }

    let topAnchor = anchors.reduce((min, a) => a.y < min ? a.y : min, H);
    if (topAnchor > cameraY - 500) {
      spawnWorld(topAnchor - 120);
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      let s = shards[i];
      s.rot += 0.04;
      if (Math.hypot(ship.x - s.x, ship.y - s.y) < ship.radius + s.radius + 14) {
        score += 150 * multiplier;
        multiplier = Math.min(8, multiplier + 1);
        scoreEl.innerText = score;
        multEl.innerText = 'x' + multiplier;
        shards.splice(i, 1);
      }
    }

    if (ship.y - cameraY > H + 50) {
      hp--;
      hpEl.innerText = 'HP: ' + hp;
      if (hp <= 0) {
        state = 'over';
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('cybershift_best', bestScore);
        }
        titleText.innerText = 'DRIFT OVER';
        subText.innerHTML = `SCORE: <strong style="color:#00ffcc">${score}</strong><br>Tap & hold to latch, release to shoot up!`;
        highScoreEl.innerText = 'BEST: ' + bestScore;
        btnAction.innerText = 'RETRY';
        overlay.style.display = 'flex';
      } else {
        ship.y = cameraY + H * 0.5;
        ship.vy = -7;
        ship.vx = 0;
        ship.tethered = null;
      }
    }

    anchors = anchors.filter(a => a.y < cameraY + H + 180);
    shards = shards.filter(s => s.y < cameraY + H + 180);
  }

  ctx.fillStyle = '#080812';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(0, -cameraY);

  for (let a of anchors) {
    a.pulse += 0.04;
    let r = a.radius + Math.sin(a.pulse) * 3;
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(a.x, a.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let s of shards) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = '#00ffaa';
    ctx.fillRect(-s.radius, -s.radius, s.radius * 2, s.radius * 2);
    ctx.restore();
  }

  if (ship.tethered) {
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ship.tethered.x, ship.tethered.y);
    ctx.lineTo(ship.x, ship.y);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(ship.x, ship.y);
  let shipAngle = Math.atan2(ship.vy, ship.vx);
  ctx.rotate(shipAngle + Math.PI / 2);
  ctx.fillStyle = '#ff0077';
  ctx.beginPath();
  ctx.moveTo(0, -ship.radius * 1.5);
  ctx.lineTo(ship.radius, ship.radius);
  ctx.lineTo(0, ship.radius * 0.6);
  ctx.lineTo(-ship.radius, ship.radius);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.restore();
}
update();
</script>
</body>
</html>
